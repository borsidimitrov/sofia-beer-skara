name: Locate new restaurant addresses
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate missing address pins
        run: node locate_new.mjs
      - name: Publish new coordinates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add locations.js
          if ! git diff --cached --quiet; then
            git commit -m "Add verified-address restaurant locations"
            git push
          fi
