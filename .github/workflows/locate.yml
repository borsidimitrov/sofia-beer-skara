name: Save restaurant locations permanently
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python geocode.py
      - name: Commit permanent location file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add locations.js
          git diff --cached --quiet || (git commit -m 'Store geocoded restaurant pins' && git push)
